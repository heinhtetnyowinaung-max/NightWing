<style>

svg.g{filter:drop-shadow(0 0 8px rgba(58,160,255,.45))}

.sb,.chip,.big{transition:transform .12s,background .2s}.sb:active,.chip:active,.big:active{transform:scale(.94)}.sb.on{box-shadow:0 0 12px rgba(58,160,255,.5)}
nav{backdrop-filter:blur(10px);background:rgba(10,11,15,.88)}nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:11px;min-width:0}

.c{position:relative}

.hero{background:linear-gradient(115deg,transparent 60%,rgba(58,160,255,.14) 60%,rgba(58,160,255,.14) 67%,transparent 67%),linear-gradient(180deg,#141722,#10121a)}
#stage{position:relative;height:440px;border-radius:14px;overflow:hidden;background:radial-gradient(70% 60% at 50% 35%,#16233a,#0b0d13);touch-action:none;cursor:grab}

.tl{position:absolute;left:0;top:0;pointer-events:none;font:600 10px ui-monospace,Menlo,monospace;color:#bfe0ff;background:rgba(10,20,34,.88);border:1px solid var(--a);padding:2px 6px;border-radius:6px;white-space:nowrap;margin:-9px 0 0 10px}
.cr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip.on{background:var(--a);color:#001a33}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fg+.m{margin-top:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sx{background:var(--s2);border-radius:12px;padding:12px}.sx b{font-size:21px}
input[type=range]{padding:0;accent-color:var(--a)}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='nightwing.v1',z=n=>String(n).padStart(2,'0');
const d2s=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()),s2d=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)},today=()=>d2s(new Date());
let S=JSON.parse(localStorage.getItem(K)||'null')||{start:today(),goal:'physique',mins:45,sleepGoal:8,waterGoal:8,fast:'20:00',habits:[],log:{}};
let tab='today',sel=today(),cal=new Date();cal.setDate(1);
let lx=0,ll=1,la=0,lw=0,an=0;
const save=()=>{localStorage.setItem(K,JSON.stringify(S));fx();render()},G=d=>S.log[d]||{},L=d=>S.log[d]||(S.log[d]={});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NAMES={A:'Full Body A',B:'Full Body B',W:'Walk + Mobility',C:'Rope / Brisk Walk',O:'Optional Cardio',R:'Rest & Review'};
const WA=[['Bulgarian split squat',3,8,15,'/leg'],['Ring row',3,8,15],['DB floor press / ring push-up',3,8,15],['DB Romanian deadlift',3,10,15],['Lateral raise',2,12,25],['Ring fallout / dead bug',2,8,15]];
const WB=[['Goblet / split squat',3,10,20],['Ring pull-up / row',3,6,15],['DB overhead press',3,8,15],['Single-leg RDL',3,8,12,'/leg'],['Ring push-up',2,8,15],['Hanging knee raise',2,10,20]];
const week=d=>Math.floor((s2d(d)-s2d(S.start))/6048e5)+1;
const plan=d=>{const w=Math.max(1,week(d)),k=s2d(d).getDay();return k==1?'A':k==3?'B':k==5?(w%2?'A':'B'):{0:'R',2:'W',4:'C',6:'O'}[k]};
function exs(d){const t=plan(d);if(t!='A'&&t!='B')return[];const w=Math.min(12,Math.max(1,week(d))),p=Math.min(1,(w-1)/7);
 let b=(t=='A'?WA:WB).map(e=>({n:e[0],s:e[1],lo:e[2],hi:e[3],u:e[4]||''}));
 b=b.slice(0,S.mins<=20?3:S.mins<=30?4:6);
 b=b.map(e=>{const hi=S.goal=='strength'?Math.round((e.lo+e.hi)/2):e.hi;e.hi=hi;e.r=Math.round(e.lo+(hi-e.lo)*p);if(w<=2)e.s=Math.min(2,e.s);else if(S.goal=='physique'&&/Lateral|press/i.test(e.n))e.s++;return e});
 if(S.goal=='fat'&&S.mins>=45)b.push({n:'Jump rope finisher',s:5,lo:30,hi:30,r:30,u:'',t:1});return b}
const done=d=>{const e=exs(d),g=G(d);return e.length>0&&e.every((x,i)=>Array.from({length:x.s},(_,j)=>g.sets&&g.sets[i+'-'+j]).every(Boolean))};
const xpDay=d=>{const g=G(d);let x=Object.keys(g.sets||{}).length*3;if(done(d))x+=50;if(g.move)x+=25;x+=(g.water||0)*2+Object.keys(g.h||{}).length*10+(g.sleep?15:0)+(g.fast?40:0)+(g.pen?30:0);return x};
const tot=()=>Object.keys(S.log).reduce((a,d)=>a+xpDay(d),0),lvl=x=>Math.floor(Math.sqrt(x/100))+1;
const RK=l=>l>=20?['S','Legend']:l>=15?['A','Nightwing']:l>=10?['B','Vigilante']:l>=6?['C','Acrobat']:l>=3?['D','Trainee']:['E','Recruit'];
const due=(h,d)=>h.f=='daily'||(h.f=='days'&&h.days.includes(s2d(d).getDay()))||(h.f=='weekly'&&(wk(h,d)<h.n||!!(G(d).h||{})[h.id]));
function wk(h,d){const x=s2d(d);x.setDate(x.getDate()-((x.getDay()+6)%7));let c=0;for(let i=0;i<7;i++){if((G(d2s(x)).h||{})[h.id])c++;x.setDate(x.getDate()+1)}return c}
function hs(h){let c=0,x=new Date();if(!(G(d2s(x)).h||{})[h.id])x.setDate(x.getDate()-1);for(let i=0;i<400;i++){const k=d2s(x);if((G(k).h||{})[h.id])c++;else if(due(h,k))break;x.setDate(x.getDate()-1)}return c}
function stat(u){u=u||today();const a=Object.keys(S.log).sort()[0]||today(),st=s2d(a<S.start?a:S.start);let c=0,sh=0,run=0;
 for(const x=new Date(st);d2s(x)<=u;x.setDate(x.getDate()+1)){const k=d2s(x);if(xpDay(k)>=40){c++;run++;if(run%7==0&&sh<2)sh++}else if(k!=today()){if(sh>0)sh--;else{c=0;run=0}}}
 return{c,sh}}
const PN=()=>{const g=L(sel);g.pen=!g.pen;if(!g.pen)delete g.pen;save()};
function pen(d){if(d!=today())return'';const y=new Date();y.setDate(y.getDate()-1);const k=d2s(y);if(k<S.start||xpDay(k)>=40)return'';const g=G(d);
 return `<div class="c" style="border-color:${g.pen?'#1d5a49':'#5a2330'}"><div class="sys" style="color:var(--r);text-shadow:0 0 8px rgba(255,93,115,.5)">[ PENALTY QUEST ]</div><b>Recovery run</b><div class="m">You missed yesterday. ${stat(k).c>0?'A Streak Shield absorbed it.':'Your streak reset.'} Take a 15-min brisk walk and drink 2 extra glasses of water to restore momentum.</div><button class="big ${g.pen?'on':''}" onclick="PN()">${g.pen?'Cleared ✓ (+30 XP)':'Clear penalty (+30 XP)'}</button></div>`}
function stats(){const a={STR:0,VIT:0,AGI:0,INT:0,REC:0};for(const d in S.log){const g=S.log[d];a.STR+=Object.keys(g.sets||{}).length;a.VIT+=g.water||0;a.AGI+=(g.move?1:0)+(done(d)?1:0);a.INT+=Object.keys(g.h||{}).length;a.REC+=(g.sleep?1:0)+(g.fast?1:0)}return a}
function quests(d){const g=G(d),t=plan(d),q=[];
 if(t=='A'||t=='B')q.push(['Complete workout',done(d),'today']);else if(t!='R')q.push(['Move: '+NAMES[t],g.move,'today']);
 q.push(['Water '+(g.water||0)+'/'+S.waterGoal,(g.water||0)>=S.waterGoal,'today']);q.push(['Log sleep',!!g.sleep,'sleep']);q.push(['16:8 fast',!!g.fast,'fast']);
 S.habits.filter(h=>due(h,d)).forEach(h=>q.push([h.name,!!(g.h||{})[h.id],'habits']));return q}
const go=t=>{tab=t;an=1;render();scrollTo(0,0)};
const T=(i,j)=>{const g=L(sel);g.sets=g.sets||{};const k=i+'-'+j;g.sets[k]?delete g.sets[k]:g.sets[k]=1;save()};
const W=n=>{const g=L(sel);g.water=Math.max(0,(g.water||0)+n);save()},M=()=>{const g=L(sel);g.move=!g.move;save()};
const H=id=>{const g=L(sel);g.h=g.h||{};g.h[id]?delete g.h[id]:g.h[id]=1;save()};
function AH(){const n=$('#hn').value.trim();if(!n)return;const f=$('#hf').value;let days=[...document.querySelectorAll('#dd input:checked')].map(i=>+i.value);if(f=='days'&&!days.length)days=[0,1,2,3,4,5,6];
 S.habits.push({id:Date.now().toString(36),name:n,f,n:Math.min(7,Math.max(1,+$('#wn').value||3)),days:f=='days'?days:[]});save()}
const DH=id=>{if(confirm('Delete this habit?')){S.habits=S.habits.filter(h=>h.id!=id);save()}};
function SL(){const b=$('#bd').value,w=$('#wk').value;if(!b||!w)return;const[bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number);let m=wh*60+wm-bh*60-bm;if(m<=0)m+=1440;S.sb=b;S.sw=w;L(sel).sleep={b,w,h:+(m/60).toFixed(1)};save()}
const FT=v=>{if(v){S.fast=v;save()}},FS=()=>{const n=new Date();S.fast=z(n.getHours())+':'+z(n.getMinutes());save()},FL=()=>{const g=L(today());g.fast=g.fast?0:1;if(!g.fast)delete g.fast;save()};
const ST=(k,v,num)=>{S[k]=num?(v===''?null:+v):v;save()};
const PH=[[0,4,'Fed state','Digesting. Blood sugar and insulin are elevated; your body is using and storing incoming energy.'],[4,8,'Post-absorptive','Insulin drifts down and the liver supplies glucose from its glycogen stores.'],[8,12,'Fat-burning shift','Liver glycogen runs low. Fat use rises and growth hormone tends to increase.'],[12,16,'Ketone production','Ketones climb and fat becomes a main fuel. Cellular clean-up (autophagy) may ramp up, though most evidence is from animal studies.']];
function fs(){const n=new Date(),[h,m]=S.fast.split(':').map(Number),st=new Date(n);st.setHours(h,m,0,0);if(st>n)st.setDate(st.getDate()-1);const el=(n-st)/36e5;return{st,el,f:el<16,end:new Date(+st+576e5),next:new Date(+st+864e5)}}
const tm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),fm=h=>{const s=Math.max(0,Math.floor(h*3600));return z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60)};
function fb(){const f=fs(),e=f.el,C=2*Math.PI*70,pr=f.f?e/16:(e-16)/8;
 return `<div style="text-align:center"><svg class="g" viewBox="0 0 180 180" width="210" height="210"><circle cx="90" cy="90" r="70" fill="none" stroke="#1f2230" stroke-width="10"/><circle cx="90" cy="90" r="70" fill="none" stroke="${f.f?'#3aa0ff':'#35d6a0'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pr} ${C}" transform="rotate(-90 90 90)"/><text x="90" y="94" text-anchor="middle" fill="#e8eaf0" font-size="25" font-weight="600">${fm(f.f?e:24-e)}</text><text x="90" y="114" text-anchor="middle" fill="#7b8194" font-size="10">${f.f?'FASTING':'EATING WINDOW'}</text></svg>
 <div class="m">${f.f?'Fast ends '+tm(f.end)+' · '+fm(16-e)+' to go':'Next fast starts '+tm(f.next)+' · break the fast with protein'}</div></div>`}
function vFast(){const f=fs(),e=f.el,n=Object.keys(S.log).filter(d=>G(d).fast).length;
 return `<h2>16:8 Fasting</h2><div class="c" id="fb">${fb()}</div>
 <div class="c"><div class="row"><div><div class="sys">[ BODY STATUS ]</div><b>Body stages</b></div><span class="m">${f.f?'hour '+Math.floor(e)+' of 16':'16h complete'}</span></div>`+PH.map(p=>{const on=f.f&&e>=p[0]&&e<p[1],past=!f.f||e>=p[1];return `<div class="ph ${on?'on':past?'past':''}"><b>${past&&!on?'✓ ':''}${p[0]}–${p[1]}h · ${p[2]}</b><div class="m" style="color:inherit;opacity:.85">${p[3]}</div></div>`}).join('')+`</div>
 <div class="c"><label>Fast starts at (eating window = the 8h before it)<input type="time" value="${S.fast}" onchange="FT(this.value)"></label><div class="m" style="margin-top:8px">Eat ${tm(f.end)} → ${tm(new Date(+f.end+288e5))}. Fast ends 16h after start.</div>
 <button class="big" onclick="FS()">Start fast now</button><button class="big ${G(today()).fast?'on':''}" onclick="FL()">${G(today()).fast?'Fast logged ✓ (+40 XP)':'Log today\'s completed fast'}</button><div class="m" style="margin-top:8px">${n} fasts logged. Skip fasting if pregnant, underweight, diabetic on medication, or have a history of disordered eating; check with a doctor.</div></div>`}
function vSleep(){const g=G(sel),b=S.sb||'23:00',w=S.sw||'07:00',[wh,wm]=w.split(':').map(Number);let bt=wh*60+wm-S.sleepGoal*60;bt=(bt+1440)%1440;
 const days=[...Array(7)].map((_,i)=>{const x=s2d(sel);x.setDate(x.getDate()-6+i);const k=d2s(x);return[k,(G(k).sleep||{}).h||0]}),lg=days.filter(a=>a[1]),avg=lg.length?(lg.reduce((a,c)=>a+c[1],0)/lg.length).toFixed(1):'–';
 return `<h2>Sleep</h2><div class="c"><div class="m">Night ending ${sel}</div><div class="row"><label style="flex:1">Bedtime<input id="bd" type="time" value="${g.sleep?g.sleep.b:b}"></label><label style="flex:1">Wake<input id="wk" type="time" value="${g.sleep?g.sleep.w:w}"></label></div>
 <button class="big ${g.sleep?'on':''}" onclick="SL()">${g.sleep?'Logged '+g.sleep.h+'h ✓ (update)':'Log sleep (+15 XP)'}</button><div class="m" style="margin-top:10px">Goal ${S.sleepGoal}h → for a ${w} wake-up, be asleep by ${z(Math.floor(bt/60))}:${z(bt%60)}.</div></div>
